<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hamrah</title>
<style>
:root{
  --bg:#0c0b10; --side:#111016; --panel:#17161d; --panel2:#1e1c26; --line:#27252f;
  --text:#f1eff3; --muted:#8d8a98; --rose:#f43f5e; --plum:#9d3358;
  --grad:linear-gradient(135deg,#f43f5e,#9d3358); --soft:rgba(244,63,94,.13);
  --ok:#34d399; --bad:#f43f5e;
  --font:"Vazirmatn","Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.85 var(--font);display:flex;overflow:hidden}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}

/* sidebar */
aside{width:292px;flex:none;background:var(--side);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px;gap:14px;z-index:20;transition:transform .25s}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo svg{width:34px;height:34px}
.logo b{font-size:23px;letter-spacing:.3px;font-weight:600;direction:ltr}
.newbtn{background:var(--grad);border:0;border-radius:12px;padding:10px 14px;font-weight:600;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.newbtn:hover{filter:brightness(1.1)}
.label{font-size:12.5px;color:var(--muted);padding:0 8px}
.hist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin:0 -4px;padding:0 4px}
.item{display:flex;align-items:center;gap:6px;border-radius:10px;padding:2px 4px 2px 2px;border:1px solid transparent}
.item:hover{background:var(--panel)}
.item.on{background:var(--soft);border-color:rgba(244,63,94,.35)}
.item .t{flex:1;min-width:0;background:none;border:0;text-align:start;padding:7px 10px;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .x{background:none;border:0;color:var(--muted);width:28px;height:28px;border-radius:8px;opacity:0}
.item:hover .x,.item.on .x{opacity:1}
.item .x:hover{color:var(--rose);background:var(--panel2)}
.none{color:var(--muted);font-size:14px;padding:8px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.box details summary{cursor:pointer;font-size:14px;color:var(--muted);list-style:none}
.box details summary::before{content:"⚙ "}
select,textarea.f,input.f{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
select,input.f{direction:ltr;text-align:left}
textarea.f{resize:vertical;min-height:84px;font-size:14px;line-height:1.7}
.row{display:flex;gap:8px}
.sm{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 12px;font-size:14px}
.sm:hover{border-color:var(--rose)}
.sm.p{background:var(--rose);border-color:var(--rose);color:#fff}
.foot{font-size:12px;color:var(--muted);text-align:center}

/* main */
.col{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:12px 22px;border-bottom:1px solid var(--line)}
header h2{margin:0;font-size:15px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;width:38px;height:38px}
.st{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)} .dot.bad{background:var(--bad)}
main{flex:1;overflow-y:auto}
.wrap{max-width:800px;margin:0 auto;padding:26px 20px 10px}

.empty{text-align:center;padding:8vh 0 0}
.empty svg{width:76px;height:76px}
.empty h1{font-size:26px;margin:14px 0 4px;font-weight:600}
.empty p{color:var(--muted);margin:0 0 26px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 16px;font-size:14px}
.chip:hover{border-color:var(--rose);background:var(--soft)}

.about{max-width:560px;margin:34px auto 0;text-align:start;background:var(--panel);border:1px solid var(--line);border-inline-start:3px solid var(--rose);border-radius:14px;padding:14px 18px;font-size:14.5px;color:#cfccd6}
.about p{margin:0 0 .6em}
.by{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.by b{color:var(--text);font-weight:600}
a{color:var(--rose);text-decoration:none} a:hover{text-decoration:underline}
.msg{display:flex;gap:12px;margin:0 0 22px}
.av{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.msg.assistant .av{background:var(--grad);border:0}
.msg.assistant .av svg{width:18px;height:18px}
.bubble{min-width:0;flex:1;padding-top:2px}
.msg.user .bubble{flex:none;max-width:85%;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px 16px;white-space:pre-wrap}
.bubble p{margin:0 0 .8em} .bubble p:last-child{margin:0}
.bubble h4{margin:1em 0 .3em;font-size:17px}
.bubble ul,.bubble ol{margin:.2em 0 .9em;padding-inline-start:1.5em}
.bubble code{font-family:var(--mono);font-size:.88em;background:var(--panel2);border-radius:5px;padding:1px 6px;direction:ltr;unicode-bidi:embed}
.code{margin:.6em 0 1em;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0a090e}
.code-head{display:flex;justify-content:space-between;align-items:center;background:var(--panel);padding:4px 12px;font:12px var(--mono);color:var(--muted)}
.copy{background:none;border:0;color:var(--muted);font:12px var(--font)}
.copy:hover{color:var(--rose)}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;text-align:left}
.code pre code{background:none;padding:0;font-size:13.5px;line-height:1.65;color:#e6e2ee}
.err{background:var(--soft);border:1px solid rgba(244,63,94,.4);border-radius:12px;padding:10px 14px;font-size:14.5px;margin-top:8px}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--rose);animation:p 1.1s infinite}
@keyframes p{50%{opacity:.25;transform:scale(.7)}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}

.comp{padding:8px 20px calc(14px + env(safe-area-inset-bottom,0px))}
.bar{max-width:800px;margin:0 auto;display:flex;align-items:flex-end;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px}
.bar:focus-within{border-color:var(--rose)}
.bar textarea{flex:1;background:none;border:0;resize:none;outline:0;padding:6px 10px;max-height:180px;line-height:1.7}
.send{flex:none;width:44px;height:44px;border:0;border-radius:13px;background:var(--grad);color:#fff;font-size:18px;display:grid;place-items:center}
.send.stop{background:var(--panel2);border:1px solid var(--line)}

@media(max-width:820px){
  aside{position:fixed;inset:0 0 0 auto;transform:translateX(100%);width:min(300px,86vw);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  aside.open{transform:none;box-shadow:-20px 0 60px rgba(0,0,0,.6)}
  .menu{display:block}
  header{padding:10px 14px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="90" y2="100"><stop offset="0" stop-color="#f43f5e"/><stop offset=".45" stop-color="#f43f5e"/><stop offset="1" stop-color="#9d3358"/></linearGradient>
    <symbol id="mark" viewBox="-6 0 100 100">
      <rect x="0" y="0" width="26" height="100" rx="13" fill="url(#g)"/>
      <path fill="url(#g)" d="M26 40C34 33 44 29.8 54 29.8C74 29.8 87.2 44 87.2 62V84C87.2 93 80 100 72 100H50L56 92.7C64 90 71.1 82 71.1 71C71.1 59 62 50.2 50 50.2H32Q26 50.2 26 56Z"/>
      <circle cx="37.4" cy="72.3" r="3.4" fill="#fff"/><circle cx="48" cy="72.3" r="3.4" fill="#fff"/><circle cx="58.7" cy="72.3" r="3.4" fill="#fff"/>
    </symbol>
  </defs>
</svg>

<aside id="side">
  <div class="logo"><svg><use href="#mark"/></svg><b>hamrah</b></div>
  <button class="newbtn" id="newBtn" type="button">＋ گفتگوی جدید</button>
  <div class="label">تاریخچه گفتگوها</div>
  <div class="hist" id="hist"></div>
  <div class="box">
    <label class="label" for="model" style="padding:0">مدل</label>
    <select id="model"></select>
    <details id="det">
      <summary>تنظیمات</summary>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
        <label class="label" for="sys" style="padding:0">دستور سیستمی</label>
        <textarea class="f" id="sys"></textarea>
        <label class="label" for="host" style="padding:0">آدرس Ollama</label>
        <input class="f" id="host">
        <div class="row"><button class="sm p" id="saveBtn" type="button">ذخیره</button><button class="sm" id="resetBtn" type="button">پیش‌فرض</button></div>
      </div>
    </details>
  </div>
  <div class="foot">همه‌چیز روی همین دستگاه می‌ماند<br><a href="https://github.com/ParsaAb13" target="_blank" rel="noopener noreferrer" dir="ltr">Parsa Abedin · GitHub</a></div>
</aside>

<div class="col">
  <header>
    <button class="menu" id="menuBtn" type="button" aria-label="منو">☰</button>
    <h2 id="title">گفتگوی جدید</h2>
    <div class="st"><span class="dot" id="dot"></span><span id="stText">در حال اتصال…</span></div>
  </header>
  <main id="main"><div class="wrap" id="chat"></div></main>
  <div class="comp">
    <div class="bar">
      <textarea id="input" rows="1" placeholder="پیامت را بنویس…"></textarea>
      <button class="send" id="sendBtn" type="button" aria-label="ارسال"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="translate(24 0) scale(-1 1)"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></g></svg></button>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var DEFAULT_HOST="http://localhost:11434";
var DEFAULT_SYSTEM="تو یک دستیار هوشمند و صمیمی به نام همراه هستی. همیشه به فارسی روان و ساده جواب بده. اصطلاحات فنی را به انگلیسی کنار توضیح فارسی بنویس. کدها را داخل بلوک کد و با توضیح کوتاه بده.";
var KEEP_ALIVE="30m", MAX_HISTORY=20;
var SUGGESTIONS=["یه برنامه مطالعه‌ی هفتگی برام بچین","برای یه سفر دو روزه چه کارهایی بکنم؟","تفاوت RAM و حافظه‌ی ذخیره‌سازی (SSD) چیه؟","یه تابع پایتون برای خواندن فایل متنی بنویس"];
var MARK='<svg><use href="#mark"/></svg>';
var SEND_ICON='<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="translate(24 0) scale(-1 1)"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></g></svg>', STOP_ICON='■';

var $=function(id){return document.getElementById(id)};
var chatEl=$("chat"),mainEl=$("main"),inputEl=$("input"),sendBtn=$("sendBtn"),modelEl=$("model"),histEl=$("hist"),side=$("side");
var S={convs:[],active:null,cfg:{host:DEFAULT_HOST,system:DEFAULT_SYSTEM,model:""}};
var busy=false,ctrl=null;

function load(){try{var d=JSON.parse(localStorage.getItem("hamrah_v1")||"null");if(d){S.convs=d.convs||[];S.active=d.active;for(var k in d.cfg)S.cfg[k]=d.cfg[k];}}catch(e){}}
function save(){try{localStorage.setItem("hamrah_v1",JSON.stringify(S))}catch(e){}}
load();

function cur(){for(var i=0;i<S.convs.length;i++)if(S.convs[i].id===S.active)return S.convs[i];return null}
function newConv(){
  var c=cur(); if(c&&!c.msgs.length)return c;
  c={id:Date.now().toString(36),title:"گفتگوی جدید",msgs:[],ts:Date.now()};
  S.convs.unshift(c);S.active=c.id;save();return c;
}

/* markdown */
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inl(s){s=esc(s);s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>");return s.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>")}
function blocks(t){
  var L=t.split("\n"),out="",list=null,para=[];
  function fp(){if(para.length){out+='<p dir="auto">'+para.map(inl).join("<br>")+"</p>";para=[]}}
  function fl(){if(list){out+="<"+list.t+' dir="auto">'+list.i.map(function(x){return"<li>"+inl(x)+"</li>"}).join("")+"</"+list.t+">";list=null}}
  for(var i=0;i<L.length;i++){
    var l=L[i].replace(/\s+$/,""),m;
    if(!l.trim()){fp();fl();continue}
    if((m=l.match(/^\s*#{1,4}\s+(.*)$/))){fp();fl();out+='<h4 dir="auto">'+inl(m[1])+"</h4>";continue}
    if((m=l.match(/^\s*[-*•]\s+(.*)$/))){fp();if(!list||list.t!=="ul"){fl();list={t:"ul",i:[]}}list.i.push(m[1]);continue}
    if((m=l.match(/^\s*(\d+)[.)]\s+(.*)$/))){fp();if(!list||list.t!=="ol"){fl();list={t:"ol",i:[]}}list.i.push(m[2]);continue}
    fl();para.push(l);
  }
  fp();fl();return out;
}
function render(text){
  var p=text.split("```"),h="";
  for(var i=0;i<p.length;i++){
    if(i%2){
      var n=p[i].indexOf("\n"),lang="",code="";
      if(n===-1)lang=p[i].trim();else{lang=p[i].slice(0,n).trim();code=p[i].slice(n+1)}
      h+='<div class="code" dir="ltr"><div class="code-head"><span>'+(esc(lang)||"code")+'</span><button class="copy" type="button">کپی</button></div><pre><code>'+esc(code.replace(/\n$/,""))+"</code></pre></div>";
    }else h+=blocks(p[i]);
  }
  return h;
}

/* ui */
function down(){mainEl.scrollTop=mainEl.scrollHeight}
function addMsg(role,content){
  var d=document.createElement("div");d.className="msg "+role;
  var av=document.createElement("div");av.className="av";
  if(role==="user")av.textContent="🙂";else av.innerHTML=MARK;
  var b=document.createElement("div");b.className="bubble";
  if(role==="user"){b.setAttribute("dir","auto");b.textContent=content}else b.innerHTML=render(content);
  d.appendChild(av);d.appendChild(b);chatEl.appendChild(d);return b;
}
function showEmpty(){
  chatEl.innerHTML='<div class="empty"><svg><use href="#mark"/></svg><h1>سلام، من همراهم</h1><p>هر چی خواستی بپرس؛ همین‌جا و بدون اینترنت جواب می‌دهم.</p></div>';
  var c=document.createElement("div");c.className="chips";
  SUGGESTIONS.forEach(function(s){var x=document.createElement("button");x.type="button";x.className="chip";x.textContent=s;x.onclick=function(){inputEl.value=s;send()};c.appendChild(x)});
  chatEl.firstChild.appendChild(c);
  var a=document.createElement("div");a.className="about";
  a.innerHTML='<p>همراه برنامه‌ای است که به شما کمک می‌کند در زمان قطعی اینترنت بتوانید راحت با مدل زبانی دلخواه خودتان ارتباط بگیرید، بدون اینکه لازم باشد سراغ PowerShell بروید یا از برنامه‌ی سنگینی مثل Jan استفاده کنید.</p><p>فعلاً فقط با متن کار می‌کند؛ شاید در آینده و در زمان مناسب، قابلیت‌های (feature) بیشتری اضافه شود.</p><div class="by">ساخته‌شده توسط <b dir="ltr">Parsa Abedin</b> <a href="https://github.com/ParsaAb13" target="_blank" rel="noopener noreferrer" dir="ltr">GitHub ↗</a></div>';
  chatEl.firstChild.appendChild(a);
}
function redraw(){
  var c=cur();chatEl.innerHTML="";
  $("title").textContent=c?c.title:"گفتگوی جدید";
  if(!c||!c.msgs.length)showEmpty();else{c.msgs.forEach(function(m){addMsg(m.role,m.content)});down()}
  drawHist();
}
function drawHist(){
  histEl.innerHTML="";
  var list=S.convs.filter(function(c){return c.msgs.length});
  if(!list.length){histEl.innerHTML='<div class="none">هنوز گفتگویی نداری.</div>';return}
  list.forEach(function(c){
    var d=document.createElement("div");d.className="item"+(c.id===S.active?" on":"");
    var t=document.createElement("button");t.type="button";t.className="t";t.textContent=c.title;t.setAttribute("dir","auto");
    t.onclick=function(){if(busy&&ctrl)ctrl.abort();S.active=c.id;save();redraw();side.classList.remove("open")};
    var x=document.createElement("button");x.type="button";x.className="x";x.textContent="✕";x.setAttribute("aria-label","حذف");
    x.onclick=function(){
      if(!confirm("این گفتگو پاک شود؟"))return;
      if(c.id===S.active&&busy&&ctrl)ctrl.abort();
      S.convs=S.convs.filter(function(k){return k.id!==c.id});
      if(S.active===c.id)S.active=S.convs.length?S.convs[0].id:null;
      save();redraw();
    };
    d.appendChild(t);d.appendChild(x);histEl.appendChild(d);
  });
}
chatEl.addEventListener("click",function(ev){
  var t=ev.target;
  if(t.classList&&t.classList.contains("copy")){
    var code=t.closest(".code").querySelector("code").textContent;
    var ok=function(){t.textContent="کپی شد ✓";setTimeout(function(){t.textContent="کپی"},1400)};
    if(navigator.clipboard)navigator.clipboard.writeText(code).then(ok,ok);
    else{var a=document.createElement("textarea");a.value=code;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}document.body.removeChild(a);ok()}
  }
});

/* ollama */
function host(){return S.cfg.host.replace(/\/+$/,"")}
function status(k,t){$("dot").className="dot "+(k||"");$("stText").textContent=t}
function loadModels(){
  status("","در حال اتصال…");
  return fetch(host()+"/api/tags").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    var list=(j.models||[]).map(function(m){return m.name});
    modelEl.innerHTML="";
    if(!list.length){status("bad","هیچ مدلی نصب نیست");return}
    list.forEach(function(n){var o=document.createElement("option");o.value=n;o.textContent=n;modelEl.appendChild(o)});
    if(list.indexOf(S.cfg.model)===-1)S.cfg.model=list.filter(function(n){return/qwen/i.test(n)})[0]||list[0];
    modelEl.value=S.cfg.model;save();status("ok","متصل است");
  }).catch(function(){status("bad","به Ollama وصل نشد")});
}
modelEl.onchange=function(){S.cfg.model=modelEl.value;save()};

function errBox(e){
  var m=String(e&&e.message||e),h;
  if(/403/.test(m)){
    var o=location.origin,lh=/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(o);
    if(!o||o==="null"||o==="file://")h="<b>Ollama درخواست را رد کرد (۴۰۳).</b><br>فایل را از آدرس localhost باز کن: در پوشه‌ی برنامه دستور <code>python -m http.server 8080</code> را بزن و <code>http://localhost:8080</code> را باز کن. Ollama به‌طور پیش‌فرض localhost را مجاز می‌داند. اگر نشد، Ollama را به‌روز کن.";
    else if(lh)h="<b>Ollama درخواست را رد کرد (۴۰۳).</b><br>آدرس Ollama را در «تنظیمات» چک کن و Ollama را به آخرین نسخه به‌روز کن.";
    else h="<b>Ollama این آدرس را مجاز نمی‌داند (۴۰۳).</b><br>فقط همین آدرس را اجازه بده، نه همه را: <code>OLLAMA_ORIGINS="+esc(o)+"</code>. بعد Ollama را کامل ببند و دوباره باز کن.";
  }
  else if(/Failed to fetch|NetworkError|Load failed/i.test(m))h="<b>به Ollama وصل نشدم.</b><br>مطمئن شو Ollama باز است و آدرس در «تنظیمات» درست است.";
  else if(/not found/i.test(m))h="<b>این مدل پیدا نشد.</b><br>با <code>ollama list</code> نامش را چک کن یا مدل دیگری انتخاب کن.";
  else h="<b>خطا:</b> <code>"+esc(m)+"</code>";
  return '<div class="err" dir="rtl">'+h+"</div>";
}
function setBusy(v){busy=v;sendBtn.innerHTML=v?STOP_ICON:SEND_ICON;sendBtn.classList.toggle("stop",v)}

function send(){
  if(busy){if(ctrl)ctrl.abort();return}
  var text=inputEl.value.trim();if(!text)return;
  if(!S.cfg.model){chatEl.insertAdjacentHTML("beforeend",errBox("Failed to fetch"));return}
  var c=cur()||newConv();
  if(!c.msgs.length){chatEl.innerHTML="";c.title=text.slice(0,40);$("title").textContent=c.title}
  c.msgs.push({role:"user",content:text});c.ts=Date.now();
  addMsg("user",text);inputEl.value="";grow();down();save();drawHist();

  var bubble=addMsg("assistant","");
  var t0=Date.now(),first=false;
  bubble.innerHTML='<div class="wait"><span class="pulse"></span><span id="wt">در حال فکر کردن…</span></div>';
  var timer=setInterval(function(){var e=$("wt");if(e&&!first)e.textContent="در حال فکر کردن… "+Math.floor((Date.now()-t0)/1000)+" ثانیه"},1000);
  var payload=[{role:"system",content:S.cfg.system}].concat(c.msgs.slice(-MAX_HISTORY));
  var answer="";ctrl=new AbortController();setBusy(true);

  fetch(host()+"/api/chat",{method:"POST",signal:ctrl.signal,headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:S.cfg.model,messages:payload,stream:true,keep_alive:KEEP_ALIVE})
  }).then(function(res){
    if(!res.ok)throw new Error("HTTP "+res.status);
    var rd=res.body.getReader(),dec=new TextDecoder(),buf="";
    function pump(){return rd.read().then(function(r){
      if(r.done)return;
      buf+=dec.decode(r.value,{stream:true});var i;
      while((i=buf.indexOf("\n"))>=0){
        var line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line)continue;
        var j;try{j=JSON.parse(line)}catch(e){continue}
        if(j.error)throw new Error(j.error);
        if(j.message&&j.message.content){first=true;answer+=j.message.content;bubble.innerHTML=render(answer);down()}
      }
      return pump();
    })}
    return pump();
  }).catch(function(e){
    if(e&&e.name==="AbortError")return;
    bubble.innerHTML=(answer?render(answer):"")+errBox(e);
  }).then(function(){
    clearInterval(timer);
    if(answer){c.msgs.push({role:"assistant",content:answer})}
    else{
      c.msgs.pop();
      if(!bubble.querySelector(".err"))bubble.innerHTML='<span style="color:var(--muted)">متوقف شد.</span>';
    }
    save();drawHist();setBusy(false);ctrl=null;inputEl.focus();
  });
}

function grow(){inputEl.style.height="auto";inputEl.style.height=Math.min(inputEl.scrollHeight,180)+"px"}
inputEl.setAttribute("dir","auto");
inputEl.addEventListener("input",grow);
inputEl.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});
sendBtn.onclick=send;
$("newBtn").onclick=function(){if(busy&&ctrl)ctrl.abort();newConv();redraw();side.classList.remove("open");inputEl.focus()};
$("menuBtn").onclick=function(){side.classList.toggle("open")};
mainEl.addEventListener("click",function(){side.classList.remove("open")});

$("det").addEventListener("toggle",function(){$("sys").value=S.cfg.system;$("host").value=S.cfg.host});
$("saveBtn").onclick=function(){S.cfg.system=$("sys").value.trim()||DEFAULT_SYSTEM;S.cfg.host=$("host").value.trim()||DEFAULT_HOST;save();loadModels();$("det").open=false};
$("resetBtn").onclick=function(){$("sys").value=DEFAULT_SYSTEM;$("host").value=DEFAULT_HOST};

if(!cur()&&S.convs.length)S.active=S.convs[0].id;
redraw();loadModels();
})();
</script>
