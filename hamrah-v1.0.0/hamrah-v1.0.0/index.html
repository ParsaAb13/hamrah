<!doctype html>
<!-- hamrah v1.0.0 -->
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="version" content="1.0.0">
<meta name="description" content="hamrah (همراه): دستیار گفتگوی فارسی و آفلاین برای مدل‌های زبانی محلی روی Ollama">
<meta name="theme-color" content="#0c0b10">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%22-6%200%20100%20100%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22g%22%20gradientUnits=%22userSpaceOnUse%22%20x1=%220%22%20y1=%220%22%20x2=%2290%22%20y2=%22100%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%23f43f5e%22/%3E%3Cstop%20offset=%22.45%22%20stop-color=%22%23f43f5e%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%239d3358%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20x=%220%22%20width=%2226%22%20height=%22100%22%20rx=%2213%22%20fill=%22url%28%23g%29%22/%3E%3Cpath%20fill=%22url%28%23g%29%22%20d=%22M26%2040C34%2033%2044%2029.8%2054%2029.8C74%2029.8%2087.2%2044%2087.2%2062V84C87.2%2093%2080%20100%2072%20100H50L56%2092.7C64%2090%2071.1%2082%2071.1%2071C71.1%2059%2062%2050.2%2050%2050.2H32Q26%2050.2%2026%2056Z%22/%3E%3C/svg%3E">
<title>hamrah</title>
<style>
:root{
  --bg:#0c0b10; --side:#111016; --panel:#17161d; --panel2:#1e1c26; --panel3:#27242f; --line:#27252f;
  --text:#f1eff3; --muted:#8d8a98; --rose:#f43f5e; --plum:#9d3358;
  --grad:linear-gradient(135deg,#f43f5e,#9d3358); --soft:rgba(244,63,94,.13);
  --ok:#34d399; --warn:#f5c451; --bad:#f43f5e; --blue:#7aa2ff;
  --font:"Vazirmatn","Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,Menlo,monospace;
  --w:900px;
}
body.wide{--w:1220px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:100vh;height:100dvh;background:var(--bg);color:var(--text);font:16px/1.85 var(--font);display:flex;overflow:hidden}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2b2938;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
svg.i{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
a{color:var(--rose);text-decoration:none} a:hover{text-decoration:underline}

/* ---------- نوار کناری ---------- */
aside{width:300px;flex:none;background:var(--side);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px 12px;gap:10px;z-index:40;transition:transform .25s;min-height:0}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo svg{width:32px;height:32px}
.logo b{font-size:22px;letter-spacing:.3px;font-weight:600;direction:ltr}
.logo small{font-size:11px;color:var(--muted);direction:ltr;margin-inline-start:auto}
.newbtn{background:var(--grad);border:0;border-radius:12px;padding:9px 14px;font-weight:600;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.newbtn:hover{filter:brightness(1.1)}
.search{position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 34px 6px 30px;font-size:14px;outline:0}
.search input:focus{border-color:var(--rose)}
.search .si{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .sx{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);width:26px;height:26px;display:none;align-items:center;justify-content:center;border-radius:7px}
.search.has .sx{display:flex}
.search .sx:hover{color:var(--text);background:var(--panel2)}
.hist{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px}
.grp{font-size:12px;color:var(--muted);padding:10px 8px 3px}
.item{display:flex;align-items:center;gap:2px;border-radius:10px;border:1px solid transparent;padding-inline-end:2px}
.item:hover{background:var(--panel)}
.item.on{background:var(--soft);border-color:rgba(244,63,94,.35)}
.item .t{flex:1;min-width:0;background:none;border:0;text-align:start;padding:6px 10px;display:flex;flex-direction:column;line-height:1.55}
.item .tt{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sn{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ia{display:flex;opacity:0}
.item:hover .ia,.item.on .ia,.item:focus-within .ia{opacity:1}
.item .ia button{background:none;border:0;color:var(--muted);width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center}
.item .ia button:hover{color:var(--text);background:var(--panel2)}
.item .ia .del:hover{color:var(--rose)}
.item.pinned .pin{color:var(--warn)}
.item .rn{flex:1;min-width:0;margin:3px 6px;background:var(--bg);border:1px solid var(--rose);border-radius:8px;padding:4px 8px;font-size:14px;outline:0}
.none{color:var(--muted);font-size:14px;padding:10px 8px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.label{font-size:12.5px;color:var(--muted)}
.box details summary{cursor:pointer;font-size:14px;color:var(--muted);list-style:none}
.box details summary::before{content:"⚙ "}
select,textarea.f,input.f{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
select,input.f{direction:ltr;text-align:left}
textarea.f{resize:vertical;min-height:84px;font-size:14px;line-height:1.7}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sm{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 12px;font-size:14px}
.sm:hover{border-color:var(--rose)}
.sm.p{background:var(--rose);border-color:var(--rose);color:#fff}
.sm.danger{color:var(--rose)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;cursor:pointer;padding:2px 0}
.tg input{accent-color:var(--rose);width:17px;height:17px}
.foot-s{font-size:12px;color:var(--muted);text-align:center;line-height:1.7}

/* ---------- ستون اصلی ---------- */
.col{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);flex:none}
header h2{margin:0;font-size:15px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{display:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;align-items:center;justify-content:center}
.menu svg{width:20px;height:20px}
.pill{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;max-width:290px;color:#d6d3dd}
.pill:hover{border-color:#3d3a49}
.pill .mn{direction:ltr;font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)} .dot.bad{background:var(--bad)} .dot.wait{background:var(--warn)}
.pop{position:absolute;top:58px;inset-inline-end:16px;width:min(350px,calc(100vw - 24px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;z-index:30;box-shadow:0 18px 50px rgba(0,0,0,.55);display:none;font-size:14px;line-height:1.7}
.pop.open{display:block}
.pop h3{margin:0 0 6px;font-size:14px}
.pop dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
.pop dt{color:var(--muted)}
.pop dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pop .ltr{direction:ltr;text-align:start;font-family:var(--mono);font-size:12.5px}
.pop hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.pop .hint{color:var(--muted);font-size:12.5px;margin-top:6px}
main{flex:1;overflow-y:auto;min-height:0}
.wrap{max-width:var(--w);margin:0 auto;padding:18px 20px 6px}

/* ---------- صفحه‌ی خوش‌آمد ---------- */
.empty{text-align:center;padding:5vh 0 0}
.empty svg.m{width:70px;height:70px}
.empty h1{font-size:25px;margin:12px 0 2px;font-weight:600}
.empty p{color:var(--muted);margin:0 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:14px}
.chip:hover{border-color:var(--rose);background:var(--soft)}
.about{max-width:560px;margin:30px auto 0;text-align:start;background:var(--panel);border:1px solid var(--line);border-inline-start:3px solid var(--rose);border-radius:14px;padding:14px 18px;font-size:14.5px;color:#cfccd6}
.about p{margin:0 0 .6em}
.by{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.by b{color:var(--text);font-weight:600}

/* ---------- پیام‌ها ---------- */
.msg{display:flex;gap:10px;margin:0 0 14px}
.av{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:var(--panel2);border:1px solid var(--line);margin-top:2px}
.msg.assistant .av{background:var(--grad);border:0}
.msg.assistant .av svg{width:17px;height:17px}
.mc{min-width:0}
.msg.assistant .mc{flex:1}
.msg.user .mc{max-width:84%;display:flex;flex-direction:column;align-items:flex-start}
.msg.user.editing .mc{max-width:100%;width:100%}
.bubble{min-width:0;max-width:100%}
.msg.user .bubble{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:6px 15px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.assistant .bubble{padding:1px 2px;overflow-wrap:anywhere}
.msg.user.editing .bubble{width:100%;background:none;border:0;padding:0}
.msg.failed{opacity:.6}
.bubble p{margin:0 0 .75em} .bubble p:last-child{margin-bottom:0}
.bubble h3,.bubble h4{margin:1em 0 .3em;line-height:1.5}
.bubble h3{font-size:19px} .bubble h4{font-size:17px}
.bubble ul,.bubble ol{margin:.2em 0 .8em;padding-inline-start:1.5em}
.bubble li ul,.bubble li ol{margin:.1em 0 .2em}
.bubble li{margin:0;line-height:1.7}
.bubble hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.bubble strong{color:#fff}
.bubble code{font-family:var(--mono);font-size:.88em;background:var(--panel2);border-radius:5px;padding:1px 6px;direction:ltr;unicode-bidi:isolate}
.tbl{overflow-x:auto;margin:.5em 0 .9em;border:1px solid var(--line);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.7}
.tbl th,.tbl td{padding:6px 12px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.tbl th{background:var(--panel);font-weight:600;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td+td,.tbl th+th{border-inline-start:1px solid var(--line)}
details.think{margin:0 0 .7em;border:1px dashed #3a3749;border-radius:10px;padding:2px 12px;color:var(--muted);font-size:14px}
details.think summary{cursor:pointer;font-size:13px}

.code{margin:.5em 0 .9em;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0a090e;text-align:left}
.code-head{display:flex;justify-content:space-between;align-items:center;background:var(--panel);padding:3px 8px 3px 14px;font:12px var(--mono);color:var(--muted)}
.copy{display:inline-flex;align-items:center;gap:5px;background:none;border:0;color:var(--muted);font:12px var(--font);padding:3px 6px;border-radius:7px}
.copy:hover{color:var(--text);background:var(--panel2)}
.code pre{margin:0;padding:11px 14px;overflow-x:auto}
.code pre code{display:block;background:none;padding:0;font-size:13.5px;line-height:1.65;color:#e6e2ee;direction:ltr;unicode-bidi:normal}
.tk-c{color:#6f6c82;font-style:italic} .tk-s{color:#9be29a} .tk-k{color:#ff6b81} .tk-n{color:#f5b27a}
.tk-f{color:#7fb0ff} .tk-p{color:#8fd3ff} .tk-v{color:#c59bff} .tk-t{color:#ff8fa3}

.foot{display:flex;align-items:center;gap:8px;min-height:28px;margin-top:1px;color:var(--muted);font-size:12.5px;flex-wrap:wrap}
.acts{display:flex;gap:1px;opacity:0;transition:opacity .12s}
.msg:hover .acts,.msg:focus-within .acts{opacity:1}
.ab{display:inline-flex;align-items:center;gap:5px;background:none;border:0;color:var(--muted);padding:3px 8px;border-radius:8px;font-size:12.5px}
.ab:hover{background:var(--panel2);color:var(--text)}
.ab.hot{color:#fff;background:var(--panel3)}
body.busy .acts{opacity:.25;pointer-events:none}
.meta{color:var(--muted)}
.badge{background:var(--soft);color:var(--rose);border-radius:99px;padding:0 9px;font-size:12px}
.gen{display:flex;align-items:center;gap:10px;color:#cfccd6;font-size:13px}
.wait{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--rose);animation:p 1.1s infinite;flex:none}
@keyframes p{50%{opacity:.25;transform:scale(.7)}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
.err{background:var(--soft);border:1px solid rgba(244,63,94,.4);border-radius:12px;padding:10px 14px;font-size:14.5px;margin-top:8px}
.err code{direction:ltr}
.ed{width:100%;min-height:84px;max-height:50vh;background:var(--bg);border:1px solid var(--rose);border-radius:12px;padding:8px 12px;resize:vertical;outline:0;line-height:1.75}
.edrow{display:flex;gap:8px;margin-top:8px}

/* ---------- نوشتن پیام ---------- */
.comp{padding:6px 20px calc(10px + env(safe-area-inset-bottom,0px));flex:none}
.bar{max-width:var(--w);margin:0 auto;display:flex;align-items:flex-end;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px}
.bar:focus-within{border-color:var(--rose)}
.bar textarea{flex:1;background:none;border:0;resize:none;outline:0;padding:6px 10px;max-height:180px;line-height:1.7}
.send{flex:none;width:42px;height:42px;border:0;border-radius:13px;background:var(--grad);color:#fff;display:grid;place-items:center}
.send svg{width:21px;height:21px}
.send.stop{background:var(--panel2);border:1px solid var(--line)}
.note{max-width:var(--w);margin:4px auto 0;text-align:center;font-size:11.5px;color:var(--muted)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--panel3);border:1px solid var(--line);padding:8px 16px;border-radius:12px;font-size:14px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.scrim{display:none}

/* ---------- موبایل و صفحه‌های کوچک ---------- */
@media(max-width:820px){
  aside{position:fixed;inset:0 0 0 auto;transform:translateX(100%);width:min(310px,88vw);padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  aside.open{transform:none;box-shadow:-20px 0 60px rgba(0,0,0,.6)}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35}
  .menu{display:flex}
  header{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
  .pill{max-width:170px;padding:4px 10px}
  .wrap{padding:12px 12px 4px}
  .comp{padding:4px 10px calc(8px + env(safe-area-inset-bottom,0px))}
  .msg{gap:8px;margin-bottom:12px}
  .av{display:none}
  .msg.user .mc{max-width:92%}
  .ab .t{display:none}
  .ab{padding:5px 9px}
  .acts{opacity:1}
  .code pre code{font-size:12.5px}
  .note{display:none}
  .empty{padding-top:2vh} .empty h1{font-size:22px}
  .pop{inset-inline-end:8px;left:8px;right:8px;width:auto;top:54px}
}
@media(hover:none){.acts{opacity:1}.item .ia{opacity:1}}
@media(pointer:coarse){.ab{min-height:34px;min-width:34px;justify-content:center}.item .ia button{width:32px;height:32px}.copy{min-height:30px}}
@media(max-width:420px){.pill .st{display:none}.logo small{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="90" y2="100"><stop offset="0" stop-color="#f43f5e"/><stop offset=".45" stop-color="#f43f5e"/><stop offset="1" stop-color="#9d3358"/></linearGradient>
    <symbol id="mark" viewBox="-6 0 100 100">
      <rect x="0" y="0" width="26" height="100" rx="13" fill="url(#g)"/>
      <path fill="url(#g)" d="M26 40C34 33 44 29.8 54 29.8C74 29.8 87.2 44 87.2 62V84C87.2 93 80 100 72 100H50L56 92.7C64 90 71.1 82 71.1 71C71.1 59 62 50.2 50 50.2H32Q26 50.2 26 56Z"/>
      <circle cx="37.4" cy="72.3" r="3.4" fill="#fff"/><circle cx="48" cy="72.3" r="3.4" fill="#fff"/><circle cx="58.7" cy="72.3" r="3.4" fill="#fff"/>
    </symbol>
  </defs>
</svg>

<div class="scrim" id="scrim"></div>
<aside id="side" aria-label="تاریخچه و تنظیمات">
  <div class="logo"><svg><use href="#mark"/></svg><b>hamrah</b><small>v1.0.0</small></div>
  <button class="newbtn" id="newBtn" type="button"></button>
  <div class="search" id="searchBox">
    <span class="si" id="siIcon"></span>
    <input id="q" type="search" placeholder="جستجو در گفتگوها…" aria-label="جستجو در گفتگوها" autocomplete="off">
    <button class="sx" id="qx" type="button" aria-label="پاک کردن جستجو"></button>
  </div>
  <div class="hist" id="hist"></div>
  <div class="box">
    <label class="label" for="model">مدل</label>
    <select id="model"></select>
    <details id="det">
      <summary>تنظیمات</summary>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
        <label class="label" for="sys">دستور سیستمی</label>
        <textarea class="f" id="sys"></textarea>
        <label class="label" for="host">آدرس Ollama</label>
        <input class="f" id="host" spellcheck="false" autocomplete="off">
        <label class="tg"><span>محتوای عریض‌تر (صفحه‌های بزرگ)</span><input type="checkbox" id="wide"></label>
        <div class="row"><button class="sm p" id="saveBtn" type="button">ذخیره</button><button class="sm" id="resetBtn" type="button">پیش‌فرض</button></div>
        <button class="sm danger" id="wipeBtn" type="button">پاک کردن همه‌ی تاریخچه</button>
      </div>
    </details>
  </div>
  <div class="foot-s">همه‌چیز روی همین دستگاه می‌ماند<br><a href="https://github.com/ParsaAb13" target="_blank" rel="noopener noreferrer" dir="ltr">Parsa Abedin · GitHub</a></div>
</aside>

<div class="col">
  <header>
    <button class="menu" id="menuBtn" type="button" aria-label="منو"></button>
    <h2 id="title">گفتگوی جدید</h2>
    <button class="pill" id="pill" type="button" aria-haspopup="dialog" aria-expanded="false" title="جزئیات اتصال و مدل"><span class="dot wait" id="dot"></span><span class="st" id="pillSt">در حال اتصال…</span><span class="mn" id="pillMn"></span></button>
  </header>
  <div class="pop" id="pop" role="dialog" aria-label="وضعیت اتصال و مدل"></div>
  <main id="main"><div class="wrap" id="chat"></div></main>
  <div class="comp">
    <div class="bar">
      <textarea id="input" rows="1" placeholder="پیامت را بنویس…" aria-label="پیام"></textarea>
      <button class="send" id="sendBtn" type="button" aria-label="ارسال"></button>

/* ====================== مارک‌داون ====================== */
function inl(s){
  s=esc(s).replace(/&lt;br\s*\/?&gt;/gi,"<br>");

  return s.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>");
}
function splitRow(l){l=l.trim();if(l.charAt(0)==="|")l=l.slice(1);if(l.charAt(l.length-1)==="|")l=l.slice(0,-1);return l.split("|").map(function(c){return c.trim()})}
function isSep(l){return l.indexOf("|")!==-1&&l.indexOf("-")!==-1&&/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l)}
function tableHtml(hd,rw){
  var n=hd.length,all=hd.join(" ")+" "+rw.map(function(r){return r.join(" ")}).join(" ");
  var h='<div class="tbl"><table dir="'+dirOf(all)+'"><thead><tr>';
  hd.forEach(function(c){h+="<th>"+inl(c)+"</th>"});
  h+="</tr></thead><tbody>";
  rw.forEach(function(r){h+="<tr>";for(var k=0;k<n;k++)h+="<td>"+inl(r[k]||"")+"</td>";h+="</tr>"});
  return h+"</tbody></table></div>";
}
/* لیست‌های تو در تو بر اساس تورفتگی */
function listHtml(items){
  var root=[],stack=[];
  items.forEach(function(it){
    var node={t:it.t,num:it.num,text:it.text,ind:it.ind,kids:[]};
    while(stack.length&&stack[stack.length-1].ind>=it.ind)stack.pop();
    if(stack.length)stack[stack.length-1].kids.push(node);else root.push(node);
    stack.push(node);
  });
  return nodesHtml(root);
}
function nodesHtml(arr){
  var out="",i=0;
  while(i<arr.length){
    var t=arr[i].t,j=i,lis="",txt=[];
    while(j<arr.length&&arr[j].t===t){lis+="<li>"+inl(arr[j].text)+(arr[j].kids.length?nodesHtml(arr[j].kids):"")+"</li>";txt.push(arr[j].text);j++}
    out+=(t==="ol"?'<ol start="'+(arr[i].num||1)+'"':"<ul")+' dir="'+dirOf(txt.join(" "))+'">'+lis+"</"+t+">";
    i=j;
  }

}
function indentOf(s){var m=s.match(/^[ \t]*/)[0];return m.replace(/\t/g,"    ").length}
function blocks(t){
  var L=t.split("\n"),out="",items=null,para=[];
  function fp(){if(para.length){out+='<p dir="'+dirOf(para.join(" "))+'">'+para.map(inl).join("<br>")+"</p>";para=[]}}
  function fl(){if(items){out+=listHtml(items);items=null}}
  for(var i=0;i<L.length;i++){
    var l=L[i].replace(/\s+$/,""),m;
    if(!l.trim()){fp();fl();continue}
    if(l.indexOf("|")!==-1&&i+1<L.length&&isSep(L[i+1])){
      fp();fl();
      var hd=splitRow(l),rw=[];i+=2;
      while(i<L.length&&L[i].trim()&&L[i].indexOf("|")!==-1){rw.push(splitRow(L[i]));i++}
      i--;out+=tableHtml(hd,rw);continue;
    }
    if(/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(l)){fp();fl();out+="<hr>";continue}
    if((m=l.match(/^\s*(#{1,6})\s+(.*)$/))){fp();fl();var tag=m[1].length<=2?"h3":"h4";out+="<"+tag+' dir="'+dirOf(m[2])+'">'+inl(m[2])+"</"+tag+">";continue}
    if((m=l.match(/^(\s*)[-*•]\s+(.*)$/))){fp();(items=items||[]).push({t:"ul",ind:indentOf(m[1]),text:m[2]});continue}
    if((m=l.match(/^(\s*)(\d+)[.)]\s+(.*)$/))){fp();(items=items||[]).push({t:"ol",ind:indentOf(m[1]),num:+m[2],text:m[3]});continue}

}

  var p=text.split("```"),h="";

      if(n===-1)info=p[i].trim();else{info=p[i].slice(0,n).trim();code=p[i].slice(n+1)}
      h+=codeBlock(info,code);
    }else h+=blocks(p[i]);

}

}

var S={convs:[],active:null,cfg:{host:DEFAULT_HOST,system:DEFAULT_SYSTEM,model:"",wide:false}};
var saveWarned=false;
function load(){
  try{
    var d=JSON.parse(localStorage.getItem(KEY)||"null");
    if(d){
      S.convs=(d.convs||[]).filter(function(c){return c&&c.id&&Array.isArray(c.msgs)});
      S.active=d.active;
      for(var k in d.cfg)S.cfg[k]=d.cfg[k];
    }
  }catch(e){}
}
function isQuota(e){return e&&(e.name==="QuotaExceededError"||e.name==="NS_ERROR_DOM_QUOTA_REACHED"||e.code===22||e.code===1014)}
function dropOldest(){
  var cand=S.convs.filter(function(c){return !c.pinned&&c.id!==S.active}).sort(function(a,b){return a.ts-b.ts});
  if(!cand.length)return false;
  S.convs=S.convs.filter(function(c){return c!==cand[0]});return true;
}
function save(){
  if(S.convs.length>MAX_CONVS){
    var extra=S.convs.filter(function(c){return !c.pinned&&c.id!==S.active}).sort(function(a,b){return a.ts-b.ts}).slice(0,S.convs.length-MAX_CONVS);
    S.convs=S.convs.filter(function(c){return extra.indexOf(c)<0});
  }
  for(var n=0;n<10;n++){
    try{localStorage.setItem(KEY,JSON.stringify(S));return true}
    catch(e){if(!(isQuota(e)&&dropOldest()))break}
  }
  if(!saveWarned){saveWarned=true;toast("حافظه‌ی مرورگر پر یا غیرفعال است؛ تاریخچه ذخیره نمی‌شود.")}
  return false;
}
load();
function cur(){for(var i=0;i<S.convs.length;i++)if(S.convs[i].id===S.active)return S.convs[i];return null}

  var c=cur();if(c&&!c.msgs.length)return c;
  c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),title:"گفتگوی جدید",msgs:[],ts:Date.now()};
  S.convs.unshift(c);S.active=c.id;save();return c;
}

var GROUPS=["سنجاق‌شده","امروز","دیروز","۷ روز اخیر","قدیمی‌تر"];
function dayStart(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function groupOf(c){
  if(c.pinned)return 0;
  var diff=Math.round((dayStart(Date.now())-dayStart(c.ts||0))/864e5);
  return diff<=0?1:diff===1?2:diff<=7?3:4;
}
function itemNode(c,snippet){
  var d=el("div","item"+(c.id===S.active?" on":"")+(c.pinned?" pinned":""));d.setAttribute("data-id",c.id);
  var t=el("button","t");t.type="button";t.setAttribute("data-a","open");
  t.innerHTML='<span class="tt" dir="'+dirOf(c.title)+'">'+esc(c.title)+"</span>"+(snippet?'<span class="sn" dir="auto">'+esc(snippet)+"</span>":"");
  var ia=el("span","ia");
  ia.innerHTML='<button type="button" class="pin" data-a="pin" title="'+(c.pinned?"برداشتن سنجاق":"سنجاق کردن")+'" aria-label="سنجاق">'+ic("pin")+'</button><button type="button" data-a="rename" title="تغییر نام" aria-label="تغییر نام">'+ic("rename")+'</button><button type="button" class="del" data-a="del" title="حذف" aria-label="حذف">'+ic("trash")+"</button>";
  d.appendChild(t);d.appendChild(ia);return d;
}
function drawHist(){
  var q=norm(qEl.value.trim());
  $("searchBox").classList.toggle("has",!!qEl.value);
  histEl.innerHTML="";
  var list=S.convs.filter(function(c){return c.msgs.length});
  if(!list.length){histEl.innerHTML='<div class="none">هنوز گفتگویی نداری.</div>';return}
  if(q){
    var found=0;
    list.sort(function(a,b){return b.ts-a.ts}).forEach(function(c){
      var snip=null,hit=norm(c.title).indexOf(q)>=0;
      if(!hit)for(var i=0;i<c.msgs.length;i++)if(norm(c.msgs[i].content).indexOf(q)>=0){hit=true;snip=c.msgs[i].content.replace(/\s+/g," ").slice(0,70);break}
      if(hit){found++;histEl.appendChild(itemNode(c,snip))}
    });
    if(!found)histEl.innerHTML='<div class="none">چیزی پیدا نشد.</div>';
    return;
  }
  var last=-1;
  list.sort(function(a,b){return (groupOf(a)-groupOf(b))||(b.ts-a.ts)}).forEach(function(c){
    var g=groupOf(c);
    if(g!==last){last=g;histEl.appendChild(el("div","grp",GROUPS[g]))}
    histEl.appendChild(itemNode(c));
  });
}

function errMsg(e){
  var m=String(e&&e.message||e);
  if(/403/.test(m)){
    var o=location.origin,lh=/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(o);

    if(lh)return "<b>Ollama درخواست را رد کرد (۴۰۳).</b><br>آدرس Ollama را در «تنظیمات» چک کن و Ollama را به آخرین نسخه به‌روز کن.";
    return "<b>Ollama این آدرس را مجاز نمی‌داند (۴۰۳).</b><br>فقط همین آدرس را اجازه بده، نه همه را: <code>OLLAMA_ORIGINS="+esc(o)+"</code>. بعد Ollama را کامل ببند و دوباره باز کن.";
  }
  if(/no models/.test(m))return "<b>هیچ مدلی نصب نیست.</b><br>در PowerShell بزن: <code>ollama pull qwen2.5:7b</code>";
  if(/Failed to fetch|NetworkError|Load failed|aborted|AbortError/i.test(m))return "<b>به Ollama وصل نشدم.</b><br>مطمئن شو Ollama باز است و آدرس در «تنظیمات» درست است.";
  if(/not found/i.test(m))return "<b>این مدل پیدا نشد.</b><br>با <code>ollama list</code> نامش را چک کن یا مدل دیگری انتخاب کن.";
  return "<b>خطا:</b> <code>"+esc(m)+"</code>";
}
function errBox(e){return '<div class="err" dir="rtl">'+errMsg(e)+"</div>"}

/* ====================== تولید پاسخ ====================== */
function join(a,b){if(!a||!b)return a+b;return /\s$/.test(a)||/^\s/.test(b)?a+b:a+" "+b}

function liveNode(idx,prior){
  var d=el("div","msg assistant");d.setAttribute("data-i",idx);
  var av=el("div","av",'<svg><use href="#mark"/></svg>'),mc=el("div","mc"),b=el("div","bubble");
  b.innerHTML=prior?renderAssistant(prior,true):'<div class="wait"><span class="pulse"></span><span>در حال بارگذاری مدل و فکر کردن…</span></div>';
  var foot=el("div","foot",'<span class="gen"><span class="gt"></span><button class="ab" type="button" data-act="stop" aria-label="توقف">'+ic("stop")+'<span class="t">توقف</span></button></span>');
  mc.appendChild(b);mc.appendChild(foot);d.appendChild(av);d.appendChild(mc);
  return{node:d,bubble:b,foot:foot,gt:foot.querySelector(".gt")};
}

/* c: گفتگو؛ restoreText: متن کاربر (فقط برای ارسال معمولی تا هنگام خطا به کادر برگردد)؛ cont: ادامه‌ی پاسخ ناتمام */
function run(c,restoreText,cont){
  if(busy)return;
  var msgs=c.msgs,last=msgs[msgs.length-1],prior="",target=null,um=null,umNode=null;
  if(!last)return;
  if(cont){target=last;prior=last.content;var old=chatEl.querySelector('.msg[data-i="'+(msgs.length-1)+'"]');if(old)old.remove()}
  else{um=last;umNode=chatEl.querySelector('.msg[data-i="'+(msgs.length-1)+'"]')}
  var live=liveNode(cont?msgs.length-1:msgs.length,prior);
  chatEl.appendChild(live.node);down();

  var t0=Date.now(),first=false,tokens=0,answerStr="",thinkStr="",tm=0,failed=null,aborted=false,doneReason="",evalCount=0,evalDur=0;
  function compose(){return (thinkStr?"<think>"+thinkStr+"</think>":"")+(prior?join(prior,answerStr):answerStr)}
  function genText(){
    var sec=Math.floor((Date.now()-t0)/1000);
    return (first?"در حال نوشتن… "+fa(tokens)+" توکن":"در حال آماده‌سازی…")+" · "+fa(sec)+" ثانیه";
  }
  live.gt.textContent=genText();
  var timer=setInterval(function(){live.gt.textContent=genText()},500);
  /* رندر حداکثر هر ۷۰ میلی‌ثانیه؛ اسکرول فقط اگر کاربر نزدیک پایین است */
  function paint(){tm=0;var s=near();live.bubble.innerHTML=renderAssistant(compose(),true);if(s)down()}
  function schedule(){if(!tm)tm=setTimeout(paint,70)}

  var hist=msgs.slice(-MAX_HISTORY).map(function(m){return{role:m.role,content:m.role==="assistant"?stripThink(m.content):m.content}});
  if(cont)hist.push({role:"user",content:CONTINUE_PROMPT});
  var payload=[{role:"system",content:S.cfg.system}].concat(hist);
  ctrl=new AbortController();setBusy(true);

  fetch(host()+"/api/chat",{method:"POST",signal:ctrl.signal,headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:S.cfg.model,messages:payload,stream:true,keep_alive:KEEP_ALIVE})
  }).then(function(res){
    if(!res.ok)return res.text().then(function(t){var d="";try{d=JSON.parse(t).error||""}catch(e){}throw new Error(d||("HTTP "+res.status))});
    var rd=res.body.getReader(),dec=new TextDecoder(),buf="";
    function pump(){return rd.read().then(function(r){
      if(r.done)return;
      buf+=dec.decode(r.value,{stream:true});var i;
      while((i=buf.indexOf("\n"))>=0){
        var line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line)continue;
        var j;try{j=JSON.parse(line)}catch(e){continue}
        if(j.error)throw new Error(j.error);
        if(j.message){
          var got=false;
          if(j.message.thinking){thinkStr+=j.message.thinking;got=true}
          if(j.message.content){answerStr+=j.message.content;got=true}
          if(got){first=true;tokens++;schedule()}
        }
        if(j.done){doneReason=j.done_reason||"";evalCount=j.eval_count||0;evalDur=j.eval_duration||0}
      }
      return pump();
    })}
    return pump();
  }).catch(function(e){
    if(tm){clearTimeout(tm);tm=0}
    if(e&&e.name==="AbortError"){aborted=true;return}
    failed=e;
  }).then(function(){
    clearInterval(timer);if(tm){clearTimeout(tm);tm=0}
    var gotNew=!!(answerStr||thinkStr),m=null,full=compose(),secs=(Date.now()-t0)/1000;
    if(gotNew){
      var tps=evalCount&&evalDur?evalCount/(evalDur/1e9):(tokens&&secs>0?tokens/secs:0);
      if(cont){m=target;m.content=full}else{m={role:"assistant",content:full,ts:Date.now(),model:S.cfg.model};msgs.push(m)}
      m.partial=!!(aborted||failed||doneReason==="length");
      m.stats={tok:evalCount||tokens,tps:Math.round(tps*10)/10,secs:Math.round(secs)};
      if(tps)info.tps=Math.round(tps*10)/10;
      c.ts=Date.now();
    }else if(cont){target.partial=true}
    var idx;
    if(m||cont){
      var mm=m||target;idx=msgs.indexOf(mm);
      var node=drawMsgNode(mm,idx,idx===msgs.length-1);
      live.node.replaceWith(node);
      if(failed)node.querySelector(".bubble").insertAdjacentHTML("beforeend",errBox(failed));
    }else{
      /* هیچ متنی نیامد: خطا یا توقف قبل از اولین کلمه */
      if(restoreText!=null){
        var k=msgs.lastIndexOf(um);if(k>=0)msgs.splice(k,1);
        if(!inputEl.value){inputEl.value=restoreText;grow()}
        if(umNode)umNode.classList.add("failed");
      }
      live.bubble.innerHTML=failed?errBox(failed):'<span style="color:var(--muted)">متوقف شد.</span>';
      live.foot.innerHTML="";live.node.classList.add("failed");
    }
    save();drawHist();setBusy(false);ctrl=null;refreshPs();
    if(!window.matchMedia("(pointer:coarse)").matches)inputEl.focus();
  });
}

/* ====================== ارسال و کارهای پیام‌ها ====================== */
function send(){
  if(busy)return;
  var text=inputEl.value.trim();if(!text)return;
  if(!S.cfg.model){
    var f=el("div","msg failed");f.innerHTML='<div class="mc">'+errBox(info.err||"Failed to fetch")+"</div>";chatEl.appendChild(f);down();return;
  }
  var c=cur()||newConv();
  chatEl.querySelectorAll(".msg.failed").forEach(function(n){n.remove()});
  if(!c.msgs.length){chatEl.innerHTML="";c.title=makeTitle(text);$("title").textContent=c.title}
  var prev=c.msgs.length-1;
  var um={role:"user",content:text,ts:Date.now()};c.msgs.push(um);c.ts=Date.now();
  if(prev>=0)refreshNode(prev);
  chatEl.appendChild(drawMsgNode(um,c.msgs.length-1,false));
  inputEl.value="";grow();down();save();drawHist();
  run(c,text,false);
}
function copyText(text,btn){
  var done=function(){
    if(!btn)return;var o=btn.innerHTML;btn.innerHTML=ic("check")+'<span class="t">کپی شد</span>';setTimeout(function(){btn.innerHTML=o},1400);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done,function(){fallbackCopy(text);done()});
  else{fallbackCopy(text);done()}
}
function fallbackCopy(text){
  var a=document.createElement("textarea");a.value=text;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();
  try{document.execCommand("copy")}catch(e){}document.body.removeChild(a);
}
function startEdit(i){
  var c=cur();if(!c||!c.msgs[i])return;
  if(editing>=0)refreshNode(editing);
  var n=chatEl.querySelector('.msg[data-i="'+i+'"]');if(!n)return;
  editing=i;n.classList.add("editing");
  var b=n.querySelector(".bubble");
  b.removeAttribute("dir");
  b.innerHTML='<textarea class="ed" aria-label="ویرایش پیام"></textarea><div class="edrow"><button class="sm p" type="button" data-act="edit-save">ذخیره و ارسال</button><button class="sm" type="button" data-act="edit-cancel">انصراف</button></div>';
  var ta=b.querySelector("textarea");ta.value=c.msgs[i].content;ta.dir=dirU(ta.value);
  ta.addEventListener("input",function(){ta.dir=dirU(ta.value)});
  ta.addEventListener("keydown",function(e){
    if(e.key==="Escape"){e.preventDefault();cancelEdit(i)}
    else if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();saveEdit(i,ta.value)}
  });
  n.querySelector(".foot").style.display="none";
  ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
}
function cancelEdit(i){editing=-1;var n=chatEl.querySelector('.msg[data-i="'+i+'"]');if(n)n.classList.remove("editing");refreshNode(i)}
function confirmTrim(c,i){return i>=c.msgs.length-1||confirm("پیام‌های بعد از این پیام (و پاسخ‌ها) حذف می‌شوند. ادامه بدهم؟")}
function saveEdit(i,text){
  var c=cur();text=text.trim();if(!c||!text||busy)return;
  if(!confirmTrim(c,i))return;
  c.msgs=c.msgs.slice(0,i);
  c.msgs.push({role:"user",content:text,ts:Date.now()});
  c.ts=Date.now();if(i===0)c.title=makeTitle(text);
  save();redraw();run(c,null,false);
}
function resendFrom(i){
  var c=cur();if(!c||busy)return;
  if(!confirmTrim(c,i))return;
  c.msgs=c.msgs.slice(0,i+1);c.ts=Date.now();save();redraw();run(c,null,false);
}
function regen(){
  var c=cur();if(!c||busy)return;
  var l=c.msgs[c.msgs.length-1];if(!l||l.role!=="assistant")return;
  c.msgs.pop();save();redraw();run(c,null,false);
}
chatEl.addEventListener("click",function(ev){
  var cp=ev.target.closest(".copy");
  if(cp){
    var code=cp.closest(".code").querySelector("code").textContent,lb=cp.querySelector("span");
    var ok=function(){lb.textContent="کپی شد ✓";setTimeout(function(){lb.textContent="کپی کد"},1400)};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(code).then(ok,function(){fallbackCopy(code);ok()});
    else{fallbackCopy(code);ok()}
    return;
  }
  var b=ev.target.closest("[data-act]");if(!b)return;
  var act=b.getAttribute("data-act");
  if(act==="stop"){if(ctrl)ctrl.abort();return}
  var msgEl=b.closest(".msg"),i=msgEl?+msgEl.getAttribute("data-i"):-1,c=cur();
  if(!c)return;
  if(act==="copy"){var m=c.msgs[i];if(m)copyText(m.role==="assistant"?stripThink(m.content):m.content,b);return}
  if(busy)return;
  if(act==="edit")startEdit(i);
  else if(act==="edit-cancel")cancelEdit(i);
  else if(act==="edit-save"){var ta=msgEl.querySelector("textarea");if(ta)saveEdit(i,ta.value)}
  else if(act==="resend")resendFrom(i);
  else if(act==="regen")regen();
  else if(act==="cont")run(c,null,true);
});

/* ====================== ورودی و تنظیمات ====================== */
function grow(){inputEl.style.height="auto";inputEl.style.height=Math.min(inputEl.scrollHeight,180)+"px";inputEl.dir=dirU(inputEl.value)}
inputEl.setAttribute("dir","rtl");
inputEl.addEventListener("input",grow);
inputEl.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!busy)send()}
});
sendBtn.onclick=function(){if(busy){if(ctrl)ctrl.abort()}else send()};
$("newBtn").onclick=function(){abortIfBusy();newConv();qEl.value="";redraw();openSide(false);inputEl.focus()};
$("menuBtn").onclick=function(){openSide(!side.classList.contains("open"))};
$("scrim").onclick=function(){openSide(false)};
mainEl.addEventListener("click",function(){if(side.classList.contains("open"))openSide(false)});
function applyCfg(){document.body.classList.toggle("wide",!!S.cfg.wide)}
$("det").addEventListener("toggle",function(){$("sys").value=S.cfg.system;$("host").value=S.cfg.host;$("wide").checked=!!S.cfg.wide});
$("saveBtn").onclick=function(){
  S.cfg.system=$("sys").value.trim()||DEFAULT_SYSTEM;S.cfg.host=$("host").value.trim()||DEFAULT_HOST;S.cfg.wide=$("wide").checked;
  save();applyCfg();loadModels();$("det").open=false;toast("ذخیره شد");
};
$("resetBtn").onclick=function(){$("sys").value=DEFAULT_SYSTEM;$("host").value=DEFAULT_HOST;$("wide").checked=false};
$("wipeBtn").onclick=function(){
  if(!S.convs.length||!confirm("کل تاریخچه‌ی گفتگوها پاک شود؟ این کار برگشت‌پذیر نیست."))return;
  abortIfBusy();S.convs=[];S.active=null;save();redraw();
};
window.addEventListener("focus",function(){if(info.state==="bad"&&!busy)loadModels(true)});

/* ====================== شروع ====================== */
applyCfg();setBusy(false);
if(!cur()){var latest=S.convs.filter(function(c){return c.msgs.length}).sort(function(a,b){return b.ts-a.ts})[0];if(latest)S.active=latest.id}
redraw();setPill();loadModels();
window.__hamrah={highlight:highlight,render:render,dirOf:dirOf,version:VERSION};
})();
</script>
